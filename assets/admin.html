<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员 · PHP 安全自查台</title><link rel="stylesheet" href="/admin.css"><script src="/admin-shared.js" defer></script><script src="/admin.js" defer></script></head>
<body><header><div class="brand"><span class="mark">P</span><div>PHP 安全自查台<small>管理员 · 历史与汇总</small></div></div><a href="/">返回扫描页</a></header>
<main><div id="notice" role="status" aria-live="polite"></div>
<section class="card" id="loginPanel"><h1>管理员登录</h1><p>输入独立管理员账号和密码后查看全站历史扫描。普通扫描页无需管理员密码。</p>
<form id="loginForm"><div class="importrow"><div><label for="adminUser">管理员账号</label><input id="adminUser" value="admin" autocomplete="username" maxlength="64" required></div><div><label for="adminPassword">密码</label><input id="adminPassword" type="password" autocomplete="current-password" maxlength="4096" required></div><button id="loginButton" class="primary" type="submit">登录</button></div></form>
<p class="hint">已有配置首次启用后台时，在服务器运行 <code>php-selfcheck add-admin --user admin</code>，保存随机密码并重启服务。</p></section>
<div id="dashboard" hidden><section class="card"><div class="sectionhead"><h1>全站扫描汇总</h1><div><span id="adminAccount"></span> <button id="logout" class="secondary">退出登录</button></div></div><div id="summary"></div></section>
<section class="card"><h2>历史扫描记录</h2><form id="searchForm"><div class="importrow"><div><label for="search">目标 URL / 访问者标识 / 任务 ID</label><input id="search" maxlength="200" placeholder="输入关键字"></div><div><label for="verdictFilter">只看某个检测结论</label><select id="verdictFilter"><option value="">全部检测结论</option></select></div><div><label for="sortOrder">排序方式</label><select id="sortOrder"><option value="newest">最新扫描优先</option><option value="oldest">最早扫描优先</option><option value="risk_desc">按结果：优先复核高风险</option><option value="risk_asc">按结果：反向排序</option></select></div><button type="submit" class="secondary">搜索</button><button id="adminRefresh" type="button" class="secondary">刷新</button></div></form>
<p class="fine">结果筛选只显示命中的目标，导出沿用筛选；删除会删除整次扫描。排队或执行中的扫描需完成后再删除。<br>免密码访问以浏览器会话标识区分，不代表实名；同一浏览器配置内的使用者共用会话。</p><div id="jobs"></div><div class="sectionhead"><button id="previous" class="secondary">上一页</button><span id="pageInfo"></span><button id="next" class="secondary">下一页</button></div></section></div></main></body></html>
